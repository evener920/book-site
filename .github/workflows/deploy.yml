name: 构建并部署网页书

# 触发方式：
#   1. 后台发布 / 本地 push 到 main → 自动重建上线
#   2. GitHub 仓库页面手动点 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 精确分页与 PDF 导出依赖真实浏览器（Pages 构建环境没有，所以在 Actions 里跑）
      - name: 安装中文字体（CI 的 Chromium 默认无 CJK 字体，CJK 会回退到异常字体导致行高暴涨、长页撑破 A4；装 Noto Serif CJK 后分页与 PDF 才一致且不被劈页）
        run: sudo apt-get update && (sudo apt-get install -y fonts-noto-cjk || sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei)
      - name: 安装 Playwright Chromium
        run: |
          npm i -D playwright-core@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium

      - name: 构建（Markdown → manifest + 静态资源）
        run: node build.js
        env:
          # 前端要连的 Worker API 地址；改这里就能换后端
          # 不要用 *.workers.dev 默认子域（部分网络会被连接重置）；改用自有域名 api.201573.xyz。
          BOOK_API: 'https://api.201573.xyz'

      - name: 精确分页（浏览器测量 → pages.json）
        run: node tools/paginate.js

      - name: 导出 PDF（→ dist/book.pdf）
        run: node tools/export-pdf.js

      - name: 部署到 Cloudflare Pages
        run: |
          # 没配凭据就只做构建校验、跳过部署（配好 secret 后自动生效）
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，跳过部署（构建与分页已校验通过）"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=book-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '82129ffe005dfd5010505adf73de06cb' }}
