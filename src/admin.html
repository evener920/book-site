<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>写书 · 后台</title>
  <link rel="stylesheet" href="./reader.css?v=__V__" />
  <link rel="stylesheet" href="./admin.css?v=__V__" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="./">← 回到书</a>
      <span id="who" style="color:var(--ink-soft)">未登录</span>
    </div>

    <h1>写书</h1>
    <p class="sub">发布后写入 GitHub 仓库，Pages 自动重建，新内容接在书末</p>

    <nav class="nav">
      <a href="./admin.html" class="active">写书</a>
      <a href="./manage.html">已有内容</a>
    </nav>

    <div class="card" id="login-card">
      <div class="field">
        <label>用户名</label>
        <input id="u" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="p" type="password" autocomplete="current-password" />
      </div>
      <button class="btn" id="btn-login">登录</button>
      <button class="btn ghost" id="btn-reg">注册</button>
      <div class="status" id="login-status"></div>
    </div>

    <div class="card hidden" id="form-card">
      <div class="two">
        <div class="field" style="flex:2">
          <label>标题</label>
          <input id="title" placeholder="如：道德经·第四章" />
        </div>
        <div class="field">
          <label>卷（留空则不并入任何卷）</label>
          <input id="volume" placeholder="如：卷一" list="vol-list" />
          <datalist id="vol-list"></datalist>
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label>日期</label>
          <input id="date" type="date" />
        </div>
        <div class="field">
          <label>顺序 order（越大越靠后，留空自动取末尾）</label>
          <input id="order" type="number" placeholder="自动" />
        </div>
      </div>
      <div class="field">
        <label>插入位置（选「某篇之后」即在中间插入；留空 = 书末）</label>
        <select id="insert-pos" style="width:100%;font-family:var(--serif);font-size:15px;border:1px solid var(--rule);border-radius:4px;background:#fbf7ec;color:var(--ink);padding:8px 10px;box-sizing:border-box;">
          <option value="">书末（默认，接在最后）</option>
        </select>
      </div>
      <div class="field">
        <label>正文（富文本 · 自动存为 Markdown）</label>
        <div class="rte">
          <div class="rte-toolbar" id="rte-toolbar">
            <button type="button" data-cmd="h2" title="一级标题">标题1</button>
            <button type="button" data-cmd="h3" title="二级标题">标题2</button>
            <span class="sep"></span>
            <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
            <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
            <span class="sep"></span>
            <button type="button" data-cmd="quote" title="引用">❝ 引用</button>
            <button type="button" data-cmd="ul" title="无序列表">• 列表</button>
            <button type="button" data-cmd="ol" title="编号条目（会作为大纲标题）">1. 大纲</button>
            <span class="sep"></span>
            <button type="button" data-cmd="link" title="插入链接">🔗 链接</button>
            <button type="button" data-cmd="code" title="代码块">{'</>'} 代码</button>
            <button type="button" data-cmd="hr" title="分隔线">― 分隔</button>
            <button type="button" data-cmd="clear" title="清除格式">清除</button>
          </div>
          <div class="rte-editor" id="rte" contenteditable="true" data-placeholder="在这里写正文，用上方工具栏加格式。发布时会自动转成 Markdown。"></div>
        </div>
        <details class="rte-src">
          <summary>查看 Markdown 源码</summary>
          <pre id="md-src"></pre>
        </details>
      </div>
      <button class="btn" id="btn-publish">发布到书</button>
      <button class="btn ghost" id="btn-logout">退出</button>
      <div class="status" id="insert-hint"></div>
      <div class="status" id="pub-status"></div>
    </div>
  </div>

  <script>window.BOOK_API = "__BOOK_API__";</script>
  <script>
  (function () {
    const API = String(window.BOOK_API || '').replace(/\/+$/, '');
    const $ = function (id) { return document.getElementById(id); };
    let token = localStorage.getItem('book_token') || '';
    let user = localStorage.getItem('book_user') || '';

    function setStatus(el, t) { $(el).innerHTML = t || ''; }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    async function call(method, path, body) {
      const r = await fetch(API + path, {
        method: method,
        headers: Object.assign({ 'Content-Type': 'application/json' },
          token ? { 'Authorization': 'Bearer ' + token } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
      let d = {};
      try { d = await r.json(); } catch (e) { d = {}; }
      if (r.status === 401) { logout(); d.error = d.error || '登录已失效，请重新登录'; }
      return d;
    }

    async function authReq(path) {
      const u = $('u').value.trim();
      const p = $('p').value;
      if (!u || !p) { setStatus('login-status', '请填写用户名和密码'); return; }
      setStatus('login-status', '正在验证…');
      const d = await call('POST', path, { username: u, password: p });
      if (d.token) {
        token = d.token;
        localStorage.setItem('book_token', token);
        localStorage.setItem('book_user', d.username);
        user = d.username;
        afterLogin();
      } else {
        setStatus('login-status', d.error || '失败');
      }
    }

    function logout() {
      token = ''; user = '';
      localStorage.removeItem('book_token');
      localStorage.removeItem('book_user');
      $('form-card').classList.add('hidden');
      $('login-card').classList.remove('hidden');
      $('who').textContent = '未登录';
    }

    async function afterLogin() {
      $('login-card').classList.add('hidden');
      $('form-card').classList.remove('hidden');
      $('who').textContent = '已登录 ' + user;
      $('date').value = new Date().toISOString().slice(0, 10);
      setStatus('login-status', '');
      // 拉卷名候选 + 文章列表（用于「插入位置」下拉与默认落书末）
      const d = await call('GET', '/api/articles');
      if (!d.error && (d.articles || []).length) {
        const vols = [];
        d.articles.forEach(function (a) { if (a.volume && vols.indexOf(a.volume) === -1) vols.push(a.volume); });
        $('vol-list').innerHTML = vols.map(function (v) { return '<option value="' + esc(v) + '">'; }).join('');
        $('order').placeholder = '自动（建议 ' + d.suggestedOrder + '）';
        populateInsertPos(d.articles);
      }
      // 「已有内容」页点「在此后插入」跳转过来时，URL 带 after/volume/afterTitle，预填插入位置
      applyInsertParam();
    }

    // 填充「插入位置」下拉：选「某篇之后」自动算出落中间的小数 order
    function populateInsertPos(arts) {
      const sorted = (arts || []).slice().sort(function (a, b) { return a.order - b.order; });
      const sel = $('insert-pos');
      if (!sel) return;
      sel.innerHTML = '<option value="">书末（默认，接在最后）</option>';
      // 书首：仅当第一篇 order>0 时提供（凡例=0 时保持最前，不提供）
      if (sorted.length && sorted[0].order > 0) {
        const o = document.createElement('option');
        o.value = Math.round((sorted[0].order - 1) * 1000) / 1000;
        o.textContent = '插到书的最前面';
        sel.appendChild(o);
      }
      sorted.forEach(function (cur, i) {
        const next = sorted[i + 1];
        const newOrder = next
          ? Math.round((cur.order + next.order) / 2 * 1000) / 1000
          : cur.order + 1;
        const o = document.createElement('option');
        o.value = newOrder;
        o.textContent = '插入到《' + cur.title + '》之后';
        sel.appendChild(o);
      });
      sel.onchange = function () {
        const v = sel.value;
        if (v === '') { $('order').value = ''; setStatus('insert-hint', ''); }
        else { $('order').value = v; }
      };
    }

    // 从 URL 预填“插入到某篇之后”：?after=<order>&volume=<卷>&afterTitle=<标题>
    function applyInsertParam() {
      const q = new URLSearchParams(location.search);
      const after = q.get('after');
      if (!after) return;
      const newOrder = Number(after);
      $('order').value = newOrder;
      const pos = $('insert-pos');
      if (pos && pos.querySelector('option[value="' + newOrder + '"]')) pos.value = newOrder;
      const vol = q.get('volume');
      if (vol) $('volume').value = vol;
      const afterTitle = q.get('afterTitle') || '所选位置';
      setStatus('insert-hint', '🔻 准备插入到《' + afterTitle + '》之后（order=' + newOrder + '）。填好标题与正文后点「发布到书」即插入到中间。');
    }

    /* ── 富文本编辑器：HTML → Markdown 转换（存进后端，与现有 pipeline 兼容） ── */
    function inlineMd(node) {
      let s = '';
      node.childNodes.forEach(function (c) {
        if (c.nodeType === 3) { s += c.textContent; return; }
        if (c.nodeType !== 1) return;
        const t = c.tagName.toLowerCase();
        const inner = inlineMd(c);
        if (t === 'strong' || t === 'b') s += '**' + inner + '**';
        else if (t === 'em' || t === 'i') s += '*' + inner + '*';
        else if (t === 'code') s += '`' + inner + '`';
        else if (t === 'a') s += '[' + inner + '](' + (c.getAttribute('href') || '') + ')';
        else if (t === 'br') s += '\n';
        else if (t === 'span') {
          // 保留批注样式（高亮背景 + 下划线）为内联 HTML，reader 端 marked 已开 html:true 渲染
          const style = c.getAttribute('style') || '';
          const cls = c.getAttribute('class') || '';
          if (/background|text-decoration/i.test(style) || /(^|\s)(anno|mark|wave|hl|uline)(\s|$)/i.test(cls)) {
            s += '<span' + (cls ? ' class="' + cls + '"' : '') + (style ? ' style="' + style + '"' : '') + '>' + inner + '</span>';
          } else {
            s += inner;
          }
        }
        else s += inner;
      });
      return s;
    }

    function htmlToMarkdown(root) {
      const lines = [];
      function walk(node, prefix) {
        prefix = prefix || '';
        node.childNodes.forEach(function (c) {
          if (c.nodeType === 3) {
            const txt = c.textContent.replace(/[ \t]+/g, ' ').replace(/\n+/g, ' ').trim();
            if (txt) lines.push(prefix + txt);
            return;
          }
          if (c.nodeType !== 1) return;
          const t = c.tagName.toLowerCase();
          if (t === 'h2') lines.push('## ' + inlineMd(c).trim());
          else if (t === 'h3') lines.push('### ' + inlineMd(c).trim());
          else if (t === 'h1' || t === 'h4' || t === 'h5' || t === 'h6') lines.push('## ' + inlineMd(c).trim());
          else if (t === 'blockquote') walk(c, '> ');
          else if (t === 'ul') {
            c.querySelectorAll(':scope > li').forEach(function (li) { lines.push(prefix + '- ' + inlineMd(li).trim()); });
          }
          else if (t === 'ol') {
            let i = 1;
            c.querySelectorAll(':scope > li').forEach(function (li) { lines.push(prefix + (i++) + '. ' + inlineMd(li).trim()); });
          }
          else if (t === 'pre') lines.push('```\n' + c.textContent.replace(/\n$/, '') + '\n```');
          else if (t === 'hr') lines.push('---');
          else if (t === 'br') lines.push('');
          else if (t === 'p' || t === 'div') {
            const txt = inlineMd(c).replace(/[ \t]+/g, ' ').trim();
            if (txt) lines.push(prefix + txt);
          }
        });
      }
      walk(root, '');
      return lines.join('\n');
    }

    function syncMd() {
      const ed = $('rte'), pre = $('md-src');
      if (ed && pre) pre.textContent = htmlToMarkdown(ed);
    }

    function initRte() {
      const ed = $('rte');
      if (!ed) return;
      // 点工具栏按钮时不抢焦点，保住当前文字选区
      $('rte-toolbar').addEventListener('mousedown', function (e) {
        if (e.target.closest('button')) e.preventDefault();
      });
      $('rte-toolbar').addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        e.preventDefault();
        ed.focus();
        const cmd = btn.getAttribute('data-cmd');
        if (cmd === 'h2') document.execCommand('formatBlock', false, 'h2');
        else if (cmd === 'h3') document.execCommand('formatBlock', false, 'h3');
        else if (cmd === 'bold') document.execCommand('bold');
        else if (cmd === 'italic') document.execCommand('italic');
        else if (cmd === 'ul') document.execCommand('insertUnorderedList');
        else if (cmd === 'ol') document.execCommand('insertOrderedList');
        else if (cmd === 'quote') document.execCommand('formatBlock', false, 'blockquote');
        else if (cmd === 'hr') document.execCommand('insertHorizontalRule');
        else if (cmd === 'code') document.execCommand('insertHTML', false, '<pre><code>\n\n</code></pre>');
        else if (cmd === 'link') {
          const url = window.prompt('链接地址（留空取消）', 'https://');
          if (url) document.execCommand('createLink', false, url);
        }
        else if (cmd === 'clear') document.execCommand('removeFormat');
        syncMd();
      });
      // 粘贴纯文本，避免带进来脏 HTML/样式
      ed.addEventListener('paste', function (e) {
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, txt);
      });
      ed.addEventListener('input', function () {
        if (!ed.textContent.trim()) ed.innerHTML = '';
        syncMd();
      });
      syncMd();
    }

    async function publish() {
      const title = $('title').value.trim();
      const body = htmlToMarkdown($('rte')).trim();
      if (!title || !body) { setStatus('pub-status', '标题和正文不能为空'); return; }
      const orderRaw = $('order').value.trim();
      const payload = {
        title: title,
        volume: $('volume').value.trim(),
        date: $('date').value,
        body: body
      };
      if (orderRaw) payload.order = Number(orderRaw);
      setStatus('pub-status', '正在提交到 GitHub…');
      const d = await call('POST', '/api/publish', payload);
      if (d.ok) {
        $('title').value = '';
        $('rte').innerHTML = '';
        $('md-src').textContent = '';
        $('order').value = '';
        setStatus('insert-hint', '');
        // 插入/发布成功后，引导去「已有内容」查看与管理
        setStatus('pub-status', '✓ 已发布到 <code>' + d.path + '</code>（order=' + d.order + '）' +
          (d.commitUrl ? ' · <a href="' + d.commitUrl + '" target="_blank">查看提交</a>' : '') +
          '<br>Cloudflare Pages 会在一分钟内自动重建并上线。' +
          ' · <a href="./manage.html">前往「已有内容」管理</a>');
      } else {
        setStatus('pub-status', '✗ ' + (d.error || '发布失败') + (d.detail ? '<br>' + JSON.stringify(d.detail) : ''));
      }
    }

    $('btn-login').onclick = function () { authReq('/api/auth/login'); };
    $('btn-reg').onclick = function () { authReq('/api/auth/register'); };
    $('btn-logout').onclick = logout;
    $('btn-publish').onclick = publish;
    initRte();

    if (!API) {
      setStatus('login-status', '未配置 API 地址：构建时请设置环境变量 BOOK_API');
      $('btn-login').disabled = true;
      $('btn-reg').disabled = true;
      return;
    }
    if (token) afterLogin();
  })();
  </script>
</body>
</html>
