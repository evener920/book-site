<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>道德经 · 网页书</title>
  <link rel="stylesheet" href="./reader.css?v=__V__" />
  <style>#app{opacity:0;transition:opacity .18s ease}#app.ready{opacity:1}</style>
  <script>window.BOOK_VERSION = "__V__";</script>
  <script src="./vendor/marked.min.js?v=__V__" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/marked@12/marked.min.js';document.head.appendChild(s);"></script>
</head>
<body>
  <div id="app">
    <aside id="toc" class="toc">
      <h2>目录</h2>
      <p class="toc-sub" id="toc-count"></p>
      <ul id="toc-list"></ul>
    </aside>
    <div id="main">
      <div id="update-bar" class="update-bar hidden">📖 已有新内容发布，<a href="#" id="update-reload">点击刷新</a>查看最新</div>
      <div id="toolbar">
        <button id="btn-prev" title="上一页（←）">‹ 上一页</button>
        <span id="page-indicator">第 1 / 1 页</span>
        <button id="btn-next" title="下一页（→）">下一页 ›</button>
        <span style="width:1px;height:22px;background:var(--rule);margin:0 4px;"></span>
        <button id="btn-zoom-out" title="缩小书页（仅书页，目录与工具栏不变）">A−</button>
        <span id="zoom-indicator" style="min-width:46px;text-align:center;color:var(--ink-soft);font-size:14px;">100%</span>
        <button id="btn-zoom-in" title="放大书页（仅书页，目录与工具栏不变）">A＋</button>
        <span style="width:1px;height:22px;background:var(--rule);margin:0 4px;"></span>
        <button id="btn-toc" title="收起 / 展开目录">目录</button>
        <button id="btn-print" title="打印 / 导出 PDF">打印</button>
        <button id="btn-pdf" title="下载 PDF">下载 PDF</button>
        <button id="btn-admin" title="后台写文章">写书</button>
        <button id="btn-insert" title="在中间插入新页面">＋插入页</button>
      </div>
      <div id="stage">
        <div id="page" class="page"></div>
      </div>
    </div>
    <div id="toc-mask" class="toc-mask hidden"></div>
  </div>

  <!-- 插入新页面 -->
  <div id="insert-modal" class="modal hidden">
    <div class="modal-card">
      <h3>插入新页面</h3>
      <label>标题</label>
      <input id="ins-title" placeholder="如：第四章 新的篇章" />
      <label>所属卷（留空则取插入位置的卷）</label>
      <input id="ins-volume" placeholder="如：卷一" />
      <label>插入到（其后）</label>
      <select id="ins-after"></select>
      <label>正文（Markdown，支持 # 标题、**加粗**、列表等）</label>
      <textarea id="ins-body" rows="6" placeholder="在此输入新页面内容…"></textarea>
      <div class="modal-row">
        <button id="ins-gen">生成 .md 文件</button>
        <button id="ins-close">关闭</button>
      </div>
      <p id="ins-msg" class="modal-msg"></p>
    </div>
  </div>
  <script src="./reader.js?v=__V__"></script>
  <script>window.BOOK_API = "__BOOK_API__";</script>
  <script src="./annotate.js?v=__V__"></script>
</body>
</html>
