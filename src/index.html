<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>道德经 · 网页书</title>
  <link rel="stylesheet" href="./reader.css?v=__V__" />
  <script>window.BOOK_VERSION = "__V__";</script>
  <script src="./vendor/marked.min.js?v=__V__" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/marked@12/marked.min.js';document.head.appendChild(s);"></script>
</head>
<body>
  <div id="app">
    <aside id="toc" class="toc">
      <h2>目录</h2>
      <p class="toc-sub" id="toc-count"></p>
      <ul id="toc-list"></ul>
    </aside>
    <div id="main">
      <div id="toolbar">
        <button id="btn-prev" title="上一页（←）">‹ 上一页</button>
        <span id="page-indicator">第 1 / 1 页</span>
        <button id="btn-next" title="下一页（→）">下一页 ›</button>
        <button id="btn-toc" title="收起 / 展开目录">目录</button>
        <button id="btn-print" title="打印 / 导出 PDF">打印</button>
        <button id="btn-pdf" title="下载 PDF">下载 PDF</button>
        <button id="btn-admin" title="后台写文章">写书</button>
      </div>
      <div id="stage">
        <div id="page" class="page"></div>
      </div>
    </div>
    <div id="toc-mask" class="toc-mask hidden"></div>
  </div>
  <script src="./reader.js?v=__V__"></script>
  <script>window.BOOK_API = "__BOOK_API__";</script>
  <script src="./annotate.js?v=__V__"></script>
</body>
</html>
